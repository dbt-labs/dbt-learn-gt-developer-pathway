models:
  - name: fct_orders
    latest_version: 1
    description: This model consolidates order information from the Jaffle Shop and payment data from Stripe to provide a comprehensive view of each order, including the total amount paid. It is useful for analyzing order statuses and payment success rates.
    config:
      contract:
        enforced: true
      group: finance
      access: public
    columns:
      - name: customer_id
        data_type: int
        description: The identifier for the customer who placed the order.
        data_tests:
          - relationships:
              arguments: 
                field: customer_id
                to: ref('dim_customer')
          - not_null
          
      - name: status
        data_type: string
        description: The current status of the order, such as returned, completed, or shipped.
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - 'returned'
                  - 'completed'
                  - 'return_pending'
                  - 'shipped'
                  - 'placed'
              config:
                severity: error
                warn_if: ">10"
                error_if: ">1000"
  
      - name: order_id
        data_type: int
        description: A unique identifier for each order.
        constraints:
          - type: not_null
          - type: unique
      - name: order_date
        data_type: date
        description: The date when the order was placed.
      - name: amount
        data_type: decimal
        description: The total amount paid for the order, defaulting to 0 if no successful payment was recorded.
    versions:
        - v: 1
          config:
            alias: fct_orders
          
          
        - v: 2  
          columns: 
            - include: all
              exclude: [order_id]
            - name: order_id
              data_type: string 
            - name: return_flag
              data_type: boolean
          
          


unit_tests:
  - name: test_fct_orders_calculates_successful_payment_amount
    description: Successful payments are summed, while orders without a successful payment default to zero.
    model: fct_orders
    given:
      - input: ref('stg_jaffle_shop__orders')
        rows:
          - {order_id: 1, customer_id: 10, order_date: '2024-01-01', status: completed}
          - {order_id: 2, customer_id: 20, order_date: '2024-01-02', status: returned}
      - input: ref('stg_stripe__payment')
        rows:
          - {order_id: 1, status: success, amount: 10.00}
          - {order_id: 1, status: success, amount: 5.00}
          - {order_id: 1, status: fail, amount: 99.00}
          - {order_id: 2, status: fail, amount: 20.00}
    expect:
      rows:
        - {order_id: 1, amount: 15.00}
        - {order_id: 2, amount: 0.00}


exposures:
  - name: orders_weekly
    type: dashboard
    depends_on:
      - ref('fct_orders')
    owner: 
      name: Jenna Bushspies
      