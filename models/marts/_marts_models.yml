models:
  - name: fct_orders
    columns:
      - name: customer_id
        data_tests:
          - relationships:
              field: customer_id
              to: ref('dim_customer')
      - name: status
        data_tests:
          - accepted_values:
              values:
                - 'returned'
                - 'completed'
                - 'return_pending'
                - 'shipped'
                - 'placed'