models:

  - name: dim_customers
    group: marketing
    latest_version: 1
    config:
      access: public
      contract:
        enforced: true

    columns:
      - name: customer_id
        data_type: int
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date
      - name: number_of_orders
        data_type: int
      - name: employee_id
        data_type: int
    
    versions:
      - v: 1
        config:
          alias: dim_customers
      - v: 2
        columns:
          - include: all
            exclude: number_of_orders
