models:

  - name: dim_customers
    latest_version: 1
    config:
      access: public
      group: marketing
      contract:
        enforced: true

    columns:
      - name: customer_id
        data_type: int
      - name: first_name
        data_type: string
      - name: last_name
        data_type: string
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date
      - name: number_of_orders
        data_type: int
      - name: employee_id
        data_type: int
    
    versions:
      - v: 1
        
exposures:
  - name: customers_weekly
    label: Weekly Customers
    type: dashboard
    maturity: low

    depends_on:
      - ref('dim_customers')

    owner:
      name: Jenna Bushspies
      email: jenna.bushspies@dbtlabs.com
